services:
  fpm:
    build:
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user:
      "${UID:-1000}:${GID:-1000}"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./docker/fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - .:/var/www/html

  nginx:
    image: nginx
    depends_on:
      fpm:
        condition: service_healthy
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/www.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
    ports:
      - "80:80"

  database:
    image: mysql:9.7.2
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: true
      MYSQL_DATABASE: "app"
      MYSQL_USER: "app"
      MYSQL_PASSWORD: "!ChangeMe!"
    ports:
      - "3306:3306"

    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 30s
      timeout: 3s
      start_interval: 5s
      start_period: 5s
